<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Interactive Website</title>
    <link rel="stylesheet" href="style.css">
  
</head>

<body>
    <h1 id="userGreeting">Hello User!</h1>
    <br>
    <br>
    <p id="message">Welcome to my interactive website. On this site you will be 
    able to modify the content dynamically with javascript. Have fun! .</p>

<br>
<br>
<br>

   <p>Customize:</p>

    <label for="userName">Your Name:</label>
    <input type="text" id="userName" placeholder="Please enter your name">
    <br>
    <br>

    <label for="displayMessage">Brief Message:</label>
    <input type="text" id="displayMessage" placeholder="Please enter your own message"><br>
        <br>

    <label for="background">Choose Background Color:</label>
    <br>


    <select id="background">
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
      
    </select><br><br>

    <button id="applyChanges">Submit</button>
  <script src="script.js"></script>
   
</body>
</html>
